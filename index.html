<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="to-do-list-wrap">
      <h1>To-Do List</h1>
      <button id="darkmode">Dark Mode</button>
      <p>These are the tasks you should do in the next 2 days</p>
    </section>

    <form id="todo-form">
      
      <section class="add-task-section">
        <input type="text" id="new-task-input" placeholder="Write a new Task...">
         <select id="day-select">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
          </select>
        <button type="button" id="add-task-btn">Add Task</button>
      </section>

      <section class="day-1">
        <h2>Monday</h2>
        <ul id="monday-list">
      
        </ul>
      </section>

      <section class="day-2">
        <h2>Tuesday</h2>
        <ul id="tuesday-list">
      
        </ul>
      </section>

      <section class="bellow">
        <button type="submit" class="button">Submit</button>
      </section>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
